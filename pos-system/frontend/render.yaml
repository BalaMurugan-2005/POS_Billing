services:
  - type: web
    name: pos-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_DJANGO_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
